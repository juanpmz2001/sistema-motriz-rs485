<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title description">
  <title id="title">Esquema de controles autorizados de la radio FlySky FS-i6 para Rafa</title>
  <desc id="description">Diagrama del frente de la radio con el joystick izquierdo, el switch CH5 y el control de velocidad CH6 destacados con óvalos rojos y textos explicativos.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17272d" flood-opacity=".24"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#17272d" flood-opacity=".16"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c6342d"/>
    </marker>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#4b555b"/>
      <stop offset="1" stop-color="#242c31"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="920" fill="#f4f8f6"/>
  <rect x="0" y="0" width="1200" height="122" fill="#07523e"/>
  <text x="58" y="53" fill="#b9ecd5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">RAFA · GUÍA DEL OPERADOR</text>
  <text x="58" y="94" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="700">Radio FS-i6 — controles que debe usar</text>

  <g filter="url(#shadow)">
    <path d="M347 205 L405 152 L795 152 L855 205 L855 710 Q855 765 800 788 L400 788 Q345 765 345 710 Z" fill="#273137" stroke="#1c2328" stroke-width="8"/>
    <path d="M426 203 L448 140 L752 140 L777 203" fill="none" stroke="#273137" stroke-width="38" stroke-linecap="round"/>
    <rect x="390" y="213" width="420" height="105" rx="18" fill="url(#panel)" stroke="#606d75" stroke-width="3"/>
    <rect x="390" y="332" width="420" height="290" rx="32" fill="#333e44" stroke="#68757e" stroke-width="3"/>
    <rect x="415" y="650" width="370" height="78" rx="10" fill="#bec7cc"/>
    <rect x="490" y="667" width="218" height="45" rx="4" fill="#abc4af"/>
    <text x="600" y="258" fill="#e9f0f2" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">FLYSKY</text>
    <text x="600" y="701" fill="#425158" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">FS-i6</text>
  </g>

  <g filter="url(#softShadow)">
    <rect x="423" y="228" width="80" height="45" rx="7" fill="#d7dce0"/>
    <rect x="447" y="236" width="31" height="29" rx="5" fill="#505d64"/>
    <path d="M463 242 L463 218" stroke="#d7a329" stroke-width="7" stroke-linecap="round"/>
    <text x="463" y="300" fill="#dbe6e9" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">CH5</text>

    <circle cx="730" cy="250" r="33" fill="#20282d" stroke="#c4cdd1" stroke-width="5"/>
    <circle cx="730" cy="250" r="20" fill="#6b757a"/>
    <path d="M730 230 L730 270" stroke="#d8e3e7" stroke-width="3"/>
    <text x="730" y="300" fill="#dbe6e9" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle">CH6</text>

    <rect x="442" y="385" width="172" height="175" rx="20" fill="#20282d" stroke="#7b878e" stroke-width="3"/>
    <circle cx="528" cy="472" r="60" fill="#414c53" stroke="#11181d" stroke-width="8"/>
    <circle cx="528" cy="472" r="39" fill="#222c31" stroke="#88959b" stroke-width="3"/>
    <circle cx="528" cy="472" r="9" fill="#bd3030"/>

    <rect x="643" y="385" width="117" height="175" rx="20" fill="#20282d" stroke="#7b878e" stroke-width="3"/>
    <circle cx="701" cy="472" r="42" fill="#414c53" stroke="#11181d" stroke-width="7"/>
    <circle cx="701" cy="472" r="26" fill="#222c31" stroke="#88959b" stroke-width="3"/>
  </g>

  <g fill="none" stroke="#c6342d" stroke-width="9">
    <ellipse cx="463" cy="249" rx="61" ry="53"/>
    <ellipse cx="730" cy="250" rx="61" ry="53"/>
    <ellipse cx="528" cy="472" rx="112" ry="111"/>
  </g>
  <g fill="#c6342d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="402" cy="215" r="19"/><text x="402" y="221" fill="#ffffff">2</text>
    <circle cx="793" cy="215" r="19"/><text x="793" y="221" fill="#ffffff">3</text>
    <circle cx="415" cy="385" r="19"/><text x="415" y="391" fill="#ffffff">1</text>
  </g>

  <path d="M306 236 C350 236 365 238 398 244" fill="none" stroke="#c6342d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M900 235 C853 235 832 239 795 245" fill="none" stroke="#c6342d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M355 712 C385 650 421 584 447 537" fill="none" stroke="#c6342d" stroke-width="4" marker-end="url(#arrow)"/>

  <g filter="url(#softShadow)">
    <rect x="44" y="156" width="262" height="154" rx="14" fill="#ffffff" stroke="#e5a6a2" stroke-width="3"/>
    <circle cx="77" cy="188" r="17" fill="#c6342d"/><text x="77" y="194" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">2</text>
    <text x="105" y="193" fill="#6f1d1b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">CH5 · TRACCIÓN RC</text>
    <text x="69" y="225" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="16">ARRIBA: radio habilitada</text>
    <text x="69" y="251" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="16">ABAJO: tracción RC deshabilitada</text>
    <text x="69" y="280" fill="#6a4b48" font-family="Arial, Helvetica, sans-serif" font-size="13">Cambiar solo con joystick centrado.</text>

    <rect x="900" y="155" width="258" height="159" rx="14" fill="#ffffff" stroke="#e5a6a2" stroke-width="3"/>
    <circle cx="933" cy="188" r="17" fill="#c6342d"/><text x="933" y="194" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">3</text>
    <text x="961" y="193" fill="#6f1d1b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">CH6 · VELOCIDAD</text>
    <text x="925" y="225" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="16">Iniciar totalmente</text>
    <text x="925" y="250" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="16">a la izquierda.</text>
    <text x="925" y="280" fill="#6a4b48" font-family="Arial, Helvetica, sans-serif" font-size="13">No superar media escala con tanque lleno.</text>

    <rect x="46" y="712" width="386" height="159" rx="14" fill="#ffffff" stroke="#e5a6a2" stroke-width="3"/>
    <circle cx="79" cy="744" r="17" fill="#c6342d"/><text x="79" y="750" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="107" y="749" fill="#6f1d1b" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700">JOYSTICK IZQUIERDO</text>
    <text x="71" y="783" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="16">ARRIBA: avance · ABAJO: reversa</text>
    <text x="71" y="809" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="16">IZQUIERDA / DERECHA: giro</text>
    <text x="71" y="839" fill="#6a4b48" font-family="Arial, Helvetica, sans-serif" font-size="13">Llevar a neutro antes de habilitar la tracción.</text>
  </g>

  <rect x="494" y="769" width="663" height="92" rx="14" fill="#fff5dc" stroke="#e5c683" stroke-width="2"/>
  <text x="518" y="800" fill="#7a4a00" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">REGLA DE SEGURIDAD</text>
  <text x="518" y="829" fill="#4d3a20" font-family="Arial, Helvetica, sans-serif" font-size="15">CH5 abajo detiene la tracción PPM; no sustituye el aislamiento eléctrico</text>
  <text x="518" y="850" fill="#4d3a20" font-family="Arial, Helvetica, sans-serif" font-size="15">ni detiene la motobomba.</text>
</svg>
