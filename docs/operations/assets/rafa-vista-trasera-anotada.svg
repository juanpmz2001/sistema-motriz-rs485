<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1200" viewBox="0 0 1280 1200" role="img" aria-labelledby="title description">
  <title id="title">Vista trasera de Rafa con batería, inversor y pulsador de paro de tracción identificados</title>
  <desc id="description">Fotografía a color de Rafa vista desde atrás con anillos rojos y etiquetas para el inversor a la izquierda de la imagen, el pulsador de paro de tracción y la batería a la derecha de la imagen.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#102a33" flood-opacity=".22"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c6342d"/>
    </marker>
  </defs>
  <rect width="1280" height="1200" fill="#f4f8f6"/>
  <rect x="0" y="0" width="1280" height="114" fill="#07523e"/>
  <text x="44" y="43" fill="#b9ecd5" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">RAFA · IDENTIFICACIÓN VISUAL</text>
  <text x="44" y="83" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700">Vista desde atrás — componentes que debe reconocer</text>

  <g filter="url(#shadow)">
    <rect x="30" y="137" width="338" height="105" rx="13" fill="#ffffff" stroke="#e5a6a2" stroke-width="3"/>
    <circle cx="61" cy="171" r="17" fill="#c6342d"/><text x="61" y="177" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">1</text>
    <text x="91" y="177" fill="#6f1d1b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">CAJA VERDE IZQUIERDA</text>
    <text x="54" y="207" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="17">INVERSOR MUST PV3000 LVHM</text>
    <text x="54" y="229" fill="#6a4b48" font-family="Arial, Helvetica, sans-serif" font-size="13">Lado izquierdo de la imagen.</text>

    <rect x="405" y="137" width="470" height="105" rx="13" fill="#ffffff" stroke="#e5a6a2" stroke-width="3"/>
    <circle cx="437" cy="171" r="17" fill="#c6342d"/><text x="437" y="177" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">2</text>
    <text x="466" y="177" fill="#6f1d1b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">PULSADOR ROJO / AMARILLO</text>
    <text x="429" y="207" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="17">PARO DE TRACCIÓN</text>
    <text x="429" y="229" fill="#6a4b48" font-family="Arial, Helvetica, sans-serif" font-size="13">No detiene la motobomba ni aísla la energía.</text>

    <rect x="914" y="137" width="336" height="105" rx="13" fill="#ffffff" stroke="#e5a6a2" stroke-width="3"/>
    <circle cx="946" cy="171" r="17" fill="#c6342d"/><text x="946" y="177" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">3</text>
    <text x="975" y="177" fill="#6f1d1b" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">CAJA VERDE DERECHA</text>
    <text x="938" y="207" fill="#26363c" font-family="Arial, Helvetica, sans-serif" font-size="17">BATERÍA MUST LiFePO4</text>
    <text x="938" y="229" fill="#6a4b48" font-family="Arial, Helvetica, sans-serif" font-size="13">48 V / 100 Ah · lado derecho de la imagen.</text>
  </g>

  <image href="rafa-vista-trasera-original.png" x="0" y="260" width="1280" height="960" preserveAspectRatio="xMidYMid meet"/>
  <rect x="0" y="260" width="1280" height="960" fill="none" stroke="#d8e5df" stroke-width="3"/>

  <g fill="none" stroke="#c6342d" stroke-width="9">
    <ellipse cx="279" cy="682" rx="155" ry="228"/>
    <ellipse cx="663" cy="614" rx="59" ry="54"/>
    <ellipse cx="1062" cy="692" rx="150" ry="230"/>
  </g>
  <g fill="#c6342d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="middle">
    <circle cx="142" cy="489" r="20"/><text x="142" y="496" fill="#ffffff">1</text>
    <circle cx="719" cy="580" r="20"/><text x="719" y="587" fill="#ffffff">2</text>
    <circle cx="939" cy="501" r="20"/><text x="939" y="508" fill="#ffffff">3</text>
  </g>
  <path d="M210 241 C225 315 246 394 261 475" fill="none" stroke="#c6342d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M640 241 C647 345 655 444 660 555" fill="none" stroke="#c6342d" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M1082 241 C1074 325 1068 410 1065 468" fill="none" stroke="#c6342d" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="24" y="1129" width="1232" height="50" rx="12" fill="#fff5dc" stroke="#e5c683" stroke-width="2"/>
  <text x="48" y="1160" fill="#7a4a00" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">IMPORTANTE:</text>
  <text x="170" y="1160" fill="#4d3a20" font-family="Arial, Helvetica, sans-serif" font-size="15">estas identificaciones se basan en la indicación del propietario; el operador no abre las cajas ni interviene sus componentes.</text>
</svg>
